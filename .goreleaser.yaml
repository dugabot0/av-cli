version: 2

project_name: av-cli

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: av-cli
    main: ./main.go
    binary: av-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: av-cli
    builds:
      - av-cli
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - README.md

nfpms:
  - id: packages
    package_name: av-cli
    builds:
      - av-cli
    vendor: dugabot0
    homepage: https://github.com/dugabot0/av-cli
    maintainer: dugabot0
    description: DMM アフィリエイト API v3 と DUGA API をラップする CLI ツール
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: dugabot0
    name: av-cli
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
